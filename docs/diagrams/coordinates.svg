<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Machine coordinates and the G54 work offset</title>
  <rect width="760" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1601f"/>
    </marker>
  </defs>
  <!-- table -->
  <rect x="60" y="40" width="640" height="370" fill="#f3f3f0" stroke="#999"/>
  <text x="70" y="62" fill="#666">machine table (top view)</text>
  <!-- machine origin -->
  <circle cx="80" cy="390" r="7" fill="#333"/>
  <line x1="80" y1="390" x2="190" y2="390" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="80" y1="390" x2="80" y2="290" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="195" y="395">X</text><text x="72" y="282">Y</text>
  <text x="92" y="425" font-weight="bold">Machine 0,0 (set by homing / REF ALL)</text>
  <!-- workpiece -->
  <rect x="330" y="140" width="300" height="120" fill="#e3d2b0" stroke="#8a6d3b" stroke-width="2"/>
  <text x="345" y="162" fill="#5c4520">workpiece</text>
  <!-- work origin -->
  <circle cx="480" cy="200" r="7" fill="#1f6fd1"/>
  <line x1="480" y1="200" x2="560" y2="200" stroke="#1f6fd1" stroke-width="2" marker-end="url(#ahb)"/>
  <line x1="480" y1="200" x2="480" y2="125" stroke="#1f6fd1" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="566" y="205" fill="#1f6fd1">X</text><text x="472" y="118" fill="#1f6fd1">Y</text>
  <text x="400" y="290" fill="#1f6fd1" font-weight="bold">Work 0,0 (G54) - where the program's X0 Y0 is</text>
  <!-- offset vector -->
  <line x1="80" y1="390" x2="474" y2="204" stroke="#d1601f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aho)"/>
  <text x="200" y="300" fill="#d1601f" font-weight="bold" transform="rotate(-25 200 300)">G54 offset = (X 191.174, Y 271.276)</text>
  <!-- formula -->
  <text x="70" y="452" font-size="14">Work position = machine position − G54 offset (− tool length, for Z)</text>
</svg>
