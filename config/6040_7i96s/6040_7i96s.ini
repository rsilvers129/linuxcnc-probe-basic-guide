# 6040 router - real machine config: Mesa 7I96S + Probe Basic
# Built 2026-10-11 by the Windows-side Claude (over SSH), from:
#   - 6040_sim.ini (screen settings, tool data, spindle limits)
#   - the live card's pin/param dump (~/linuxcnc/hm2_7i96s_pins.txt / _params.txt, 2026-10-10)
#   - the owner's current Mach3 profile (RnR card): travel, homing directions, A scale, speeds
#   - "7i96S wiring and setup plan.md"
# Values marked (confirm) must be checked on the machine before relying on them.

[EMC]
VERSION = 1.1
MACHINE = 6040 router (Mesa 7I96S)
DEBUG = 0

[DISPLAY]
DISPLAY = probe_basic
THEME_COLOR = dark
ANTIALIAS = true
FPS = 60
CONFIRM_EXIT = False
LOG_FILE = probe_basic.log
LOG_LEVEL = DEBUG
ADVANCED_LOGGING = False
PREFERENCE_FILE = 6040_7i96s.pref
CONFIG_FILE = custom_config.yml
POSITION = 0x0
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.500000
MIN_SPINDLE_OVERRIDE = 0.500000
DEFAULT_SPINDLE_SPEED = 18000
# jog speeds, mm/s (46.667 mm/s = 2800 mm/min)
DEFAULT_LINEAR_VELOCITY = 25.000000
MAX_LINEAR_VELOCITY = 46.666667
MIN_LINEAR_VELOCITY = 0.100000
# deg/s (11.667 deg/s = 700 deg/min)
DEFAULT_ANGULAR_VELOCITY = 5.000000
MAX_ANGULAR_VELOCITY = 11.666667
MIN_ANGULAR_VELOCITY = 0.100000
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 5
INCREMENTS = JOG 1.0 0.1 0.01
USER_TABS_PATH = user_tabs/
USER_BUTTONS_PATH = user_buttons/
USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = XYZA
# The preview draws A as a rotation about X; this machine's A turns about Y (drawing only).
GEOMETRY = XYZA
OFFSET_COLUMNS = XYZAR
TOOL_TABLE_COLUMNS = TZDR
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true
ATC_TAB_DISPLAY = 0

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
    png = image-to-gcode
    gif = image-to-gcode
    jpg = image-to-gcode

[RS274NGC]
# G21 mm; G64 P0.02 = 0.02 mm path tolerance
RS274NGC_STARTUP_CODE = F500 S18000 G21 G17 G40 G49 G54 G64 P0.02 G80 G90 G91.1 G92.1 G94 G97 G98
PARAMETER_FILE = 6040_7i96s.var
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
SUBROUTINE_PATH = subroutines
ON_ABORT_COMMAND = O<on_abort> CALL

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
# Mesa Ethernet: servo thread only, no base thread
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = hallib/6040_7i96s.hal
HALUI = halui
POSTGUI_HALFILE = hallib/probe_basic_postgui.hal
TWOPASS = on

[HALUI]
# MDI commands for the XHC WHB04B-6 pendant buttons (hallib/xhc_whb04b6.hal), in order 00, 01, 02:
MDI_COMMAND = G53 G0 Z0
MDI_COMMAND = o<go_to_zero> call
MDI_COMMAND = o<touch_plate> call

[HOSTMOT2]
DRIVER = hm2_eth
BOARD = 7i96s
# Jumpers W4 down, W5 up (EEPROM address). PC side: enp2s0 = 10.10.10.1/24 (NM profile mesa-7i96s).
BOARD_IP = 10.10.10.10
# (not read: the config string is written out in hallib/6040_7i96s.hal - keep both the same)
CONFIG = "num_encoders=1 num_pwmgens=1 num_stepgens=5"

[TRAJ]
AXES = 4
SPINDLES = 1
COORDINATES = X Y Z A
HOME = 0 0 0 0 0
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 25.0
MAX_LINEAR_VELOCITY = 46.666667

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
DB_PROGRAM = ./tool_db.sh
TOOL_DB_FILE = 6040_tools.db
TOOL_CHANGE_QUILL_UP = 1

[KINS]
KINEMATICS = trivkins coordinates=XYZA
JOINTS = 4

[SPINDLE_0]
# GDZ-80 2.2 kW, 400 Hz = 24,000 rpm max; keep above about 6,000 rpm.
# Driven over RS-485 Modbus (hallib/6040_7i96s.hal, modbus/mk100.mbccs): 24000 rpm = 100 % = VFD 1000H value 10000.
MAX_FORWARD_VELOCITY = 24000
MIN_FORWARD_VELOCITY = 6000
# At-speed now comes from the VFD running frequency read over Modbus; the old fixed SPINUP_DELAY is gone.

#==================
#      X Axis   (stepgen 0, DM542H)
# 2026-10-12: X/Y/Z drivers rewired like A: PUL+/DIR+ to TB1 +5V, PUL-/DIR- to STEPn-/DIRn-.
#==================
# Travel 380 mm (owner). Homes toward minus (Mach3 M0Neg=1); one switch = home + both limits.
# Switch on INPUT0 (yellow wire, old card IN1).

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 380.0
MAX_VELOCITY = 46.666667
MAX_ACCELERATION = 240.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 46.666667
MAX_ACCELERATION = 240.0
STEPGEN_MAXVEL = 58.333333
STEPGEN_MAXACCEL = 300.0
# 1600 steps/rev (DM542H switches) / 5 mm lead
# 2026-10-20: was 320.0. Probe + ring gauge 24.995 + 1-2-3 block in both orientations showed X reported
# distances 0.323% long (ballscrew lead slightly under 5 mm); Y is accurate. MAX_LIMIT kept at 380 (owner: conservative).
SCALE = 321.034
MIN_LIMIT = 0.0
MAX_LIMIT = 380.0
FERROR = 1.0
MIN_FERROR = 0.25
# home switch sits 1 mm below X0
HOME_OFFSET = -4.0
HOME_SEARCH_VEL = -10.0
HOME_LATCH_VEL = -1.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
# step timing, ns (DM542H, conservative)
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
# Output polarity. Mach3 had: step active-low, dir not inverted (Motor0DirNeg=0).
# If X jogs the wrong way, toggle DIR_INVERT (0/1).
STEP_INVERT = 0
DIR_INVERT = 1

#==================
#      Y Axis   (stepgen 1, TB1 STEP1+/DIR1+, DM542H)
#==================
# Travel 567 mm (owner). Homes toward minus (Mach3 M1Neg=1). Switch on INPUT1 (red wire, old IN2).

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 567.0
MAX_VELOCITY = 46.666667
MAX_ACCELERATION = 240.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 46.666667
MAX_ACCELERATION = 240.0
STEPGEN_MAXVEL = 58.333333
STEPGEN_MAXACCEL = 300.0
SCALE = 320.0
MIN_LIMIT = 0.0
MAX_LIMIT = 567.0
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = -4.0
HOME_SEARCH_VEL = -10.0
HOME_LATCH_VEL = -1.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
# Mach3: step active-low, dir inverted (Motor1DirNeg=1)
STEP_INVERT = 0
DIR_INVERT = 0

#==================
#      Z Axis   (stepgen 2, TB1 STEP2+/DIR2+, DM542H)
#==================
# Z0 = top of travel; Mach3 soft limit -105. Homes up (Mach3 M2Neg=0). Switch on INPUT2 (white, old IN3).

[AXIS_Z]
MIN_LIMIT = -105.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 46.666667
MAX_ACCELERATION = 240.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 46.666667
MAX_ACCELERATION = 240.0
STEPGEN_MAXVEL = 58.333333
STEPGEN_MAXACCEL = 300.0
SCALE = 320.0
MIN_LIMIT = -105.0
MAX_LIMIT = 0.0
FERROR = 1.0
MIN_FERROR = 0.25
# home switch sits 1 mm above Z0
HOME_OFFSET = 4.0
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = 1.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
# Mach3: step active-low, dir inverted (Motor2DirNeg=1)
STEP_INVERT = 0
DIR_INVERT = 0

#==================
#      A Axis   (stepgen 3, TB1 STEP3-/DIR3-, JP-1635A common-anode board)
#==================
# Rotary, not wrapped (Vectric's long rotations are intentional). No home switch: homes in place.
# Mach3: 26.66 steps/deg, 700 deg/min, 100 deg/s^2. 26.6667 = 1600 steps x 6:1 / 360 (confirm with A360).

[AXIS_A]
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0
MAX_VELOCITY = 11.666667
MAX_ACCELERATION = 100.0

[JOINT_3]
TYPE = ANGULAR
HOME = 0.000
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0
MAX_VELOCITY = 11.666667
MAX_ACCELERATION = 100.0
STEPGEN_MAXVEL = 14.583333
STEPGEN_MAXACCEL = 125.0
SCALE = 26.666667
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
# Wired to the minus outputs, so the levels are already the opposite of the + outputs.
# Matching Mach3 (step active-low, dir not inverted) on a minus output = STEP_INVERT 0, DIR_INVERT 1.
STEP_INVERT = 0
DIR_INVERT = 1
